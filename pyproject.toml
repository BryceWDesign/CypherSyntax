[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CypherSyntax"
version = "0.1.0"
description = "Defensive hybrid-ready secure messaging core built from an audit of BlackVault and IX-GhostProtocol"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Bryce Lovell"}]
dependencies = [
  "cryptography>=46.0.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.0,<10",
  "pytest-cov>=6.0,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "-q",
  "--strict-config",
  "--strict-markers",
  "--cov=cyphersyntax",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["cyphersyntax"]

[tool.coverage.report]
fail_under = 80
show_missing = true
